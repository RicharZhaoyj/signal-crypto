name: Signal Auto Update

on:
  schedule:
    # 避开整点拥堵，并每 30 分钟提供一次调度机会，降低 GitHub Actions 延迟导致的数据陈旧。
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: signal-auto-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate latest data
        run: python generate_data.py

      - name: Generate coin pages
        run: python generate_coin_pages.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html data.json coin/ sitemap.xml coin_history.json
          git diff --cached --quiet || git commit -m "Auto update: $(date '+%Y-%m-%d %H:%M') [SSR+Coin Pages]"
          git push
