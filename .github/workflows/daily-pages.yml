name: Signal Daily Pages

on:
  schedule:
    # 每日 0:00 CST (UTC+8) = UTC 16:00 前一日
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  generate-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate latest market data
        run: python generate_data.py

      - name: Generate coin pages
        run: python generate_coin_pages.py

      - name: Generate daily summary page
        run: python generate_daily_pages.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html data.json coin/ sitemap.xml coin_history.json daily/ daily_index.json
          git diff --cached --quiet || git commit -m "Daily report: $(date -u -d '+8 hours' '+%Y-%m-%d') [Daily Page]"
          git push
